<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="vialGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="uniGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="94" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.8" />

  <!-- Divisor dinámico en arco que une Vial y Personal -->
  <path d="M 64 256 C 180 200, 332 312, 448 256" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- SECTOR SUPERIOR IZQUIERDO: AFORO VIAL (Vía, Semáforo y Vehículo) -->
  <g id="sector-vial">
    <!-- Semáforo estilizado -->
    <rect x="68" y="78" width="46" height="116" rx="23" fill="#030712" stroke="#3b82f6" stroke-width="3.5" />
    <circle cx="91" cy="102" r="12" fill="#ef4444" opacity="0.9" />
    <circle cx="91" cy="136" r="12" fill="#f59e0b" opacity="0.9" />
    <circle cx="91" cy="170" r="12" fill="#10b981" filter="url(#glow)" />

    <!-- Tramo de vía en perspectiva -->
    <path d="M 136 210 L 195 90 L 245 90 L 220 210 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="3.5" />
    <line x1="190" y1="100" x2="182" y2="135" stroke="#f59e0b" stroke-width="5" stroke-dasharray="10 8" />
    <line x1="178" y1="145" x2="168" y2="200" stroke="#f59e0b" stroke-width="7" stroke-dasharray="12 10" />

    <!-- Icono vehículo estilizado -->
    <g transform="translate(142, 132) scale(0.65)">
      <path d="M 16 48 C 16 38, 26 28, 38 24 L 52 14 C 60 8, 76 8, 84 14 L 98 24 C 110 28, 120 38, 120 48 L 124 60 C 124 66, 118 70, 112 70 L 24 70 C 18 70, 12 66, 12 60 Z" fill="#3b82f6" />
      <path d="M 38 27 L 50 17 C 56 13, 78 13, 84 17 L 96 27 Z" fill="#bfdbfe" opacity="0.85" />
      <circle cx="28" cy="58" r="6" fill="#fef08a" />
      <circle cx="106" cy="58" r="6" fill="#fef08a" />
    </g>

    <!-- Tag indicador Vial -->
    <rect x="70" y="212" width="102" height="26" rx="13" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.5" />
    <text x="121" y="229" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="1">VIAL</text>
  </g>

  <!-- SECTOR SUPERIOR DERECHO: AFORO PERSONAL UNIVERSITARIO (Bloque y Flujo de Personas) -->
  <g id="sector-personal">
    <!-- Silueta de Bloque / Edificio Universitario -->
    <path d="M 320 90 L 434 90 L 434 210 L 320 210 Z" fill="#0f291e" stroke="#10b981" stroke-width="3.5" rx="6" />
    <!-- Ventanas del bloque universitario -->
    <rect x="338" y="108" width="20" height="22" rx="4" fill="#34d399" fill-opacity="0.75" />
    <rect x="372" y="108" width="20" height="22" rx="4" fill="#34d399" fill-opacity="0.75" />
    <rect x="404" y="108" width="16" height="22" rx="4" fill="#34d399" fill-opacity="0.75" />
    <rect x="338" y="142" width="20" height="22" rx="4" fill="#34d399" fill-opacity="0.75" />
    <rect x="372" y="142" width="20" height="22" rx="4" fill="#34d399" fill-opacity="0.75" />
    <rect x="404" y="142" width="16" height="22" rx="4" fill="#34d399" fill-opacity="0.75" />
    <!-- Puerta frontal de acceso -->
    <path d="M 368 180 L 396 180 L 396 210 L 368 210 Z" fill="#10b981" />

    <!-- Grupo de personas ingresando (Personas / Estudiantes) -->
    <!-- Persona 1 (Centro) -->
    <circle cx="282" cy="138" r="13" fill="#34d399" />
    <path d="M 264 186 C 264 162, 272 154, 282 154 C 292 154, 300 162, 300 186 Z" fill="#34d399" />
    <!-- Persona 2 (Frente) -->
    <circle cx="254" cy="154" r="11" fill="#6ee7b7" />
    <path d="M 239 194 C 239 174, 246 168, 254 168 C 262 168, 269 174, 269 194 Z" fill="#6ee7b7" />

    <!-- Tag indicador Personal -->
    <rect x="334" y="212" width="102" height="26" rx="13" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
    <text x="385" y="229" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">BLOQUES</text>
  </g>

  <!-- NODO CENTRAL / EMBLEMA "AC" (AFORO & CONTEO) -->
  <g id="emblema-central" transform="translate(0, 10)">
    <!-- Aura de resplandor -->
    <circle cx="256" cy="300" r="74" fill="url(#brandGrad)" opacity="0.25" filter="url(#glow)" />
    <!-- Círculo contenedor principal -->
    <circle cx="256" cy="300" r="62" fill="#090d16" stroke="url(#brandGrad)" stroke-width="5" />

    <!-- Icono de Conteo Digital / Personas + Carro entrelazados -->
    <!-- Letras estilizadas AC -->
    <text x="256" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      AC
    </text>
  </g>

  <!-- LEYENDA INFERIOR INSTITUCIONAL: AFORO & CONTEO - UNIGUAJIRA -->
  <g id="texto-inferior" transform="translate(0, 15)">
    <text x="256" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      SISTEMA DE AFORO Y CONTEO
    </text>
    <text x="256" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
      UNIVERSIDAD DE LA GUAJIRA
    </text>

    <!-- Subtítulo de docentes líderes -->
    <rect x="54" y="454" width="404" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="256" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8" text-anchor="middle">
      Vial: <tspan fill="#60a5fa" font-weight="700">Marlyn Aaron</tspan> • Universitario: <tspan fill="#34d399" font-weight="700">Robert Quintero</tspan>
    </text>
  </g>
</svg>