<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Road & Crosswalk / Lanes -->
  <path d="M 176 430 L 220 140 L 292 140 L 336 430 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="6" />
  <line x1="256" y1="160" x2="256" y2="210" stroke="#f59e0b" stroke-width="8" stroke-dasharray="16 12" />
  <line x1="256" y1="240" x2="256" y2="300" stroke="#f59e0b" stroke-width="10" stroke-dasharray="20 14" />
  <line x1="256" y1="340" x2="256" y2="410" stroke="#f59e0b" stroke-width="12" stroke-dasharray="24 16" />

  <!-- Traffic Light housing -->
  <rect x="76" y="140" width="70" height="190" rx="35" fill="#090d16" stroke="#475569" stroke-width="5" />
  <!-- Red light -->
  <circle cx="111" cy="178" r="22" fill="#ef4444" opacity="0.9" />
  <!-- Yellow light -->
  <circle cx="111" cy="235" r="22" fill="#f59e0b" opacity="0.9" />
  <!-- Green light -->
  <circle cx="111" cy="292" r="22" fill="#10b981" filter="drop-shadow(0 0 12px #10b981)" />

  <!-- Digital Counter Display Top Right -->
  <rect x="330" y="140" width="116" height="74" rx="16" fill="#090d16" stroke="#3b82f6" stroke-width="4" />
  <text x="388" y="188" font-family="monospace, monospace" font-size="34" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">084</text>
  <text x="388" y="206" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">AFORO</text>

  <!-- Car outline -->
  <g transform="translate(200, 310) scale(0.9)">
    <path d="M 20 60 C 20 50, 30 35, 45 30 L 60 20 C 70 12, 90 12, 100 20 L 115 30 C 130 35, 140 50, 140 60 L 145 75 C 145 82, 140 86, 132 86 L 28 86 C 20 86, 15 82, 15 75 Z" fill="#3b82f6" />
    <path d="M 46 34 L 59 23 C 65 18, 77 18, 83 23 L 96 34 Z" fill="#93c5fd" opacity="0.8" />
    <!-- Headlights -->
    <ellipse cx="28" cy="72" rx="7" ry="5" fill="#fef08a" />
    <ellipse cx="132" cy="72" rx="7" ry="5" fill="#fef08a" />
  </g>

  <!-- Badge at bottom: PTV Vissim -->
  <rect x="136" y="440" width="240" height="42" rx="21" fill="url(#accentGrad)" />
  <text x="256" y="467" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">PTV VISSIM</text>
</svg>